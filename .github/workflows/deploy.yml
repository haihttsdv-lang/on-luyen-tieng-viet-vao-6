name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Quality gate before anything goes live — matches the DoD in CLAUDE.md.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # Đồng bộ đa thiết bị (tùy chọn, Mục 13/SY-01→15): các biến này là cấu
      # hình client Firebase công khai theo thiết kế (bảo mật thực sự nằm ở
      # Firestore Rules + Anonymous Auth, không phải ở việc giấu các giá trị
      # này) — dùng GitHub Actions secrets chỉ để tách khỏi mã nguồn, không
      # phải vì bản thân chúng là bí mật. Nếu repo chưa cấu hình các secret
      # này, các biến rỗng khiến `isCloudSyncAvailable()` trả về false và
      # mục Đồng bộ tự ẩn/khoá theo đúng SY-14 — build vẫn thành công bình
      # thường, không lỗi.
      - run: npm run build:gh-pages
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-gh-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
